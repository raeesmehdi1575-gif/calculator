<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #141e30, #243b55);
        }

        .calculator {
            width: 360px;
            background: #1e1e1e;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
        }

        .title {
            text-align: center;
            color: white;
            font-size: 22px;
            margin-bottom: 15px;
        }

        .display {
            width: 100%;
            height: 100px;
            background: #111;
            border-radius: 12px;
            margin-bottom: 15px;
            padding: 15px;
            color: white;
            text-align: right;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }

        #previous {
            color: #888;
            font-size: 18px;
            min-height: 25px;
        }

        #current {
            color: white;
            font-size: 35px;
            font-weight: bold;
            overflow-x: auto;
            white-space: nowrap;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 65px;
            border: none;
            border-radius: 12px;
            font-size: 21px;
            cursor: pointer;
            background: #333;
            color: white;
            transition: 0.15s;
        }

        button:hover {
            transform: scale(1.04);
            background: #444;
        }

        button:active {
            transform: scale(0.95);
        }

        .operator {
            background: #ff9500;
        }

        .operator:hover {
            background: #ffad33;
        }

        .function {
            background: #555;
        }

        .function:hover {
            background: #666;
        }

        .equals {
            background: #28a745;
        }

        .equals:hover {
            background: #34c759;
        }

        .zero {
            grid-column: span 2;
        }

        .history {
            margin-top: 20px;
            background: #111;
            border-radius: 12px;
            padding: 12px;
            color: white;
            max-height: 120px;
            overflow-y: auto;
        }

        .history h3 {
            font-size: 16px;
            margin-bottom: 8px;
            color: #aaa;
        }

        .history-item {
            font-size: 14px;
            padding: 4px 0;
            color: #ddd;
        }

        @media (max-width: 400px) {
            .calculator {
                width: 95%;
            }

            button {
                height: 60px;
            }
        }
    </style>
</head>

<body>

    <div class="calculator">

        <div class="title">
            My Calculator
        </div>

        <div class="display">
            <div id="previous"></div>
            <div id="current">0</div>
        </div>

        <div class="buttons">

            <!-- First Row -->
            <button class="function" onclick="clearCalculator()">AC</button>
            <button class="function" onclick="deleteNumber()">⌫</button>
            <button class="function" onclick="percentage()">%</button>
            <button class="operator" onclick="chooseOperator('÷')">÷</button>

            <!-- Second Row -->
            <button onclick="appendNumber('7')">7</button>
            <button onclick="appendNumber('8')">8</button>
            <button onclick="appendNumber('9')">9</button>
            <button class="operator" onclick="chooseOperator('×')">×</button>

            <!-- Third Row -->
            <button onclick="appendNumber('4')">4</button>
            <button onclick="appendNumber('5')">5</button>
            <button onclick="appendNumber('6')">6</button>
            <button class="operator" onclick="chooseOperator('-')">−</button>

            <!-- Fourth Row -->
            <button onclick="appendNumber('1')">1</button>
            <button onclick="appendNumber('2')">2</button>
            <button onclick="appendNumber('3')">3</button>
            <button class="operator" onclick="chooseOperator('+')">+</button>

            <!-- Fifth Row -->
            <button class="zero" onclick="appendNumber('0')">0</button>
            <button onclick="appendDecimal()">.</button>
            <button class="equals" onclick="calculate()">=</button>

        </div>

        <div class="history">
            <h3>Calculation History</h3>
            <div id="historyList"></div>
        </div>

    </div>


    <script>

        // Variables
        let currentNumber = "0";
        let previousNumber = "";
        let operator = null;
        let shouldResetScreen = false;

        const currentDisplay = document.getElementById("current");
        const previousDisplay = document.getElementById("previous");
        const historyList = document.getElementById("historyList");


        // Update display
        function updateDisplay() {

            currentDisplay.textContent = currentNumber;

            if (operator !== null) {
                previousDisplay.textContent =
                    previousNumber + " " + operator;
            } else {
                previousDisplay.textContent = "";
            }
        }


        // Add number
        function appendNumber(number) {

            if (currentNumber === "Error") {
                currentNumber = "0";
            }

            if (shouldResetScreen) {
                currentNumber = "";
                shouldResetScreen = false;
            }

            if (currentNumber === "0") {
                currentNumber = number;
            } else {
                currentNumber += number;
            }

            updateDisplay();
        }


        // Add decimal
        function appendDecimal() {

            if (shouldResetScreen) {
                currentNumber = "0";
                shouldResetScreen = false;
            }

            if (!currentNumber.includes(".")) {
                currentNumber += ".";
            }

            updateDisplay();
        }


        // Select operator
        function chooseOperator(selectedOperator) {

            if (currentNumber === "Error") {
                return;
            }

            if (operator !== null && !shouldResetScreen) {
                calculate();
            }

            previousNumber = currentNumber;
            operator = selectedOperator;
            shouldResetScreen = true;

            updateDisplay();
        }


        // Calculate result
        function calculate() {

            if (operator === null || shouldResetScreen) {
                return;
            }

            let firstNumber = parseFloat(previousNumber);
            let secondNumber = parseFloat(currentNumber);
            let result;

            if (isNaN(firstNumber) || isNaN(secondNumber)) {
                return;
            }

            switch (operator) {

                case "+":
                    result = firstNumber + secondNumber;
                    break;

                case "-":
                    result = firstNumber - secondNumber;
                    break;

                case "×":
                    result = firstNumber * secondNumber;
                    break;

                case "÷":

                    if (secondNumber === 0) {
                        currentNumber = "Error";
                        previousDisplay.textContent =
                            "Cannot divide by zero";

                        operator = null;
                        previousNumber = "";

                        updateDisplay();
                        return;
                    }

                    result = firstNumber / secondNumber;
                    break;
            }

            let calculation =
                firstNumber + " " +
                operator + " " +
                secondNumber + " = " +
                result;

            addToHistory(calculation);

            currentNumber = formatNumber(result);

            previousNumber = "";
            operator = null;
            shouldResetScreen = true;

            updateDisplay();
        }


        // Format large decimal results
        function formatNumber(number) {

            if (!Number.isFinite(number)) {
                return "Error";
            }

            return parseFloat(number.toFixed(10)).toString();
        }


        // Clear calculator
        function clearCalculator() {

            currentNumber = "0";
            previousNumber = "";
            operator = null;
            shouldResetScreen = false;

            updateDisplay();
        }


        // Delete last number
        function deleteNumber() {

            if (shouldResetScreen) {
                return;
            }

            if (currentNumber.length === 1) {
                currentNumber = "0";
            } else {
                currentNumber =
                    currentNumber.slice(0, -1);
            }

            updateDisplay();
        }


        // Percentage
        function percentage() {

            if (currentNumber === "Error") {
                return;
            }

            let number = parseFloat(currentNumber);

            number = number / 100;

            currentNumber = formatNumber(number);

            updateDisplay();
        }


        // Add calculation to history
        function addToHistory(calculation) {

            let item = document.createElement("div");

            item.className = "history-item";

            item.textContent = calculation;

            historyList.prepend(item);

            // Keep only last 5 calculations
            while (historyList.children.length > 5) {
                historyList.removeChild(
                    historyList.lastChild
                );
            }
        }


        // Keyboard support
        document.addEventListener("keydown", function(event) {

            const key = event.key;

            // Numbers
            if (key >= "0" && key <= "9") {
                appendNumber(key);
            }

            // Decimal
            else if (key === ".") {
                appendDecimal();
            }

            // Addition
            else if (key === "+") {
                chooseOperator("+");
            }

            // Subtraction
            else if (key === "-") {
                chooseOperator("-");
            }

            // Multiplication
            else if (key === "*") {
                chooseOperator("×");
            }

            // Division
            else if (key === "/") {
                chooseOperator("÷");
            }

            // Enter
            else if (key === "Enter" || key === "=") {
                calculate();
            }

            // Backspace
            else if (key === "Backspace") {
                deleteNumber();
            }

            // Escape
            else if (key === "Escape") {
                clearCalculator();
            }

            // Percentage
            else if (key === "%") {
                percentage();
            }

        });


        // Initial display
        updateDisplay();

    </script>

</body>
</html>
