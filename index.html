<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Smart Calculator</title>

    <style>

        /* =========================
           RESET
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }


        /* =========================
           BODY
        ========================= */

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            background:
                radial-gradient(circle at top left, #243b55, transparent 40%),
                radial-gradient(circle at bottom right, #141e30, transparent 45%),
                #0f172a;
        }


        /* =========================
           CALCULATOR
        ========================= */

        .calculator {
            width: 380px;
            max-width: 100%;

            padding: 22px;

            background: #1e293b;

            border: 1px solid rgba(255,255,255,0.08);

            border-radius: 24px;

            box-shadow:
                0 25px 60px rgba(0,0,0,0.5),
                inset 0 1px 0 rgba(255,255,255,0.05);
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 18px;
        }

        .title {
            color: white;
            font-size: 22px;
            font-weight: bold;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 12px;
            margin-top: 4px;
        }

        .status {
            width: 10px;
            height: 10px;

            border-radius: 50%;

            background: #22c55e;

            box-shadow: 0 0 12px #22c55e;
        }


        /* =========================
           DISPLAY
        ========================= */

        .display {
            width: 100%;
            min-height: 125px;

            padding: 18px;

            margin-bottom: 18px;

            background: #0b1120;

            border-radius: 18px;

            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;

            overflow: hidden;

            border: 1px solid rgba(255,255,255,0.05);
        }

        #previous {
            width: 100%;

            min-height: 25px;

            color: #64748b;

            font-size: 17px;

            text-align: right;

            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #current {
            width: 100%;

            color: white;

            font-size: 42px;

            font-weight: bold;

            text-align: right;

            white-space: nowrap;

            overflow-x: auto;
            overflow-y: hidden;

            scrollbar-width: none;
        }

        #current::-webkit-scrollbar {
            display: none;
        }


        /* =========================
           KEYBOARD HINT
        ========================= */

        .keyboard-hint {
            text-align: center;

            color: #64748b;

            font-size: 12px;

            margin-bottom: 15px;
        }


        /* =========================
           BUTTON GRID
        ========================= */

        .buttons {
            display: grid;

            grid-template-columns: repeat(4, 1fr);

            gap: 11px;
        }


        /* =========================
           GENERAL BUTTON
        ========================= */

        button {
            height: 64px;

            border: none;

            border-radius: 15px;

            color: white;

            font-size: 21px;

            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.1s,
                filter 0.15s,
                box-shadow 0.15s;

            user-select: none;
        }

        button:hover {
            filter: brightness(1.15);

            transform: translateY(-2px);
        }

        button:active,
        button.active {
            transform: scale(0.94);

            filter: brightness(0.9);
        }


        /* =========================
           NUMBER BUTTONS
        ========================= */

        .number {
            background: #2563eb;

            box-shadow:
                0 5px 0 #1d4ed8;
        }

        .number:hover {
            box-shadow:
                0 7px 0 #1d4ed8;
        }


        /* =========================
           ZERO BUTTON
        ========================= */

        .zero {
            grid-column: span 2;
        }


        /* =========================
           OPERATORS
        ========================= */

        .operator {
            background: #f59e0b;

            box-shadow:
                0 5px 0 #d97706;
        }


        /* =========================
           FUNCTION BUTTONS
        ========================= */

        .function {
            background: #7c3aed;

            box-shadow:
                0 5px 0 #6d28d9;
        }


        /* =========================
           CLEAR
        ========================= */

        .clear {
            background: #ef4444;

            box-shadow:
                0 5px 0 #dc2626;
        }


        /* =========================
           EQUAL
        ========================= */

        .equals {
            background: #16a34a;

            box-shadow:
                0 5px 0 #15803d;
        }


        /* =========================
           HISTORY
        ========================= */

        .history {
            margin-top: 20px;

            padding: 14px;

            background: #0f172a;

            border-radius: 16px;

            border: 1px solid rgba(255,255,255,0.05);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 10px;
        }

        .history-title {
            color: white;

            font-size: 15px;

            font-weight: bold;
        }

        .history-count {
            color: #64748b;

            font-size: 11px;
        }

        #historyList {
            max-height: 110px;

            overflow-y: auto;
        }

        .history-item {
            padding: 7px 4px;

            color: #cbd5e1;

            font-size: 14px;

            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .empty-history {
            color: #475569;

            text-align: center;

            font-size: 13px;

            padding: 8px;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 430px) {

            body {
                padding: 12px;
            }

            .calculator {
                padding: 16px;

                border-radius: 20px;
            }

            .display {
                min-height: 110px;
            }

            #current {
                font-size: 34px;
            }

            button {
                height: 58px;

                font-size: 19px;

                border-radius: 13px;
            }

            .buttons {
                gap: 9px;
            }
        }

    </style>
</head>


<body>


    <div class="calculator">


        <!-- HEADER -->

        <div class="header">

            <div>

                <div class="title">
                    Smart Calculator
                </div>

                <div class="subtitle">
                    HTML • CSS • JavaScript
                </div>

            </div>

            <div class="status"></div>

        </div>


        <!-- DISPLAY -->

        <div class="display">

            <div id="previous"></div>

            <div id="current">
                0
            </div>

        </div>


        <!-- KEYBOARD HINT -->

        <div class="keyboard-hint">
            Keyboard supported • Enter = Calculate • Esc = Clear
        </div>


        <!-- BUTTONS -->

        <div class="buttons">


            <!-- ROW 1 -->

            <button
                class="clear"
                data-key="Escape"
                onclick="clearCalculator()">
                CLR
            </button>


            <button
                class="function"
                data-key="Backspace"
                onclick="deleteNumber()">
                ⌫
            </button>


            <button
                class="function"
                data-key="%"
                onclick="percentage()">
                %
            </button>


            <button
                class="operator"
                data-key="/"
                onclick="chooseOperator('÷')">
                ÷
            </button>


            <!-- ROW 2 -->

            <button
                class="number"
                data-key="7"
                onclick="appendNumber('7')">
                7
            </button>


            <button
                class="number"
                data-key="8"
                onclick="appendNumber('8')">
                8
            </button>


            <button
                class="number"
                data-key="9"
                onclick="appendNumber('9')">
                9
            </button>


            <button
                class="operator"
                data-key="*"
                onclick="chooseOperator('×')">
                ×
            </button>


            <!-- ROW 3 -->

            <button
                class="number"
                data-key="4"
                onclick="appendNumber('4')">
                4
            </button>


            <button
                class="number"
                data-key="5"
                onclick="appendNumber('5')">
                5
            </button>


            <button
                class="number"
                data-key="6"
                onclick="appendNumber('6')">
                6
            </button>


            <button
                class="operator"
                data-key="-"
                onclick="chooseOperator('-')">
                −
            </button>


            <!-- ROW 4 -->

            <button
                class="number"
                data-key="1"
                onclick="appendNumber('1')">
                1
            </button>


            <button
                class="number"
                data-key="2"
                onclick="appendNumber('2')">
                2
            </button>


            <button
                class="number"
                data-key="3"
                onclick="appendNumber('3')">
                3
            </button>


            <button
                class="operator"
                data-key="+"
                onclick="chooseOperator('+')">
                +
            </button>


            <!-- ROW 5 -->

            <button
                class="number zero"
                data-key="0"
                onclick="appendNumber('0')">
                0
            </button>


            <button
                class="number"
                data-key="."
                onclick="appendDecimal()">
                .
            </button>


            <button
                class="equals"
                data-key="Enter"
                onclick="calculate()">
                =
            </button>

        </div>


        <!-- HISTORY -->

        <div class="history">

            <div class="history-header">

                <div class="history-title">
                    Calculation History
                </div>

                <div
                    class="history-count"
                    id="historyCount">
                    0 calculations
                </div>

            </div>


            <div id="historyList">

                <div class="empty-history">
                    No calculations yet
                </div>

            </div>

        </div>


    </div>



    <script>

        /* =====================================
           CALCULATOR VARIABLES
        ===================================== */

        let currentNumber = "0";

        let previousNumber = "";

        let operator = null;

        let shouldResetScreen = false;

        let lastOperation = null;



        /* =====================================
           DISPLAY ELEMENTS
        ===================================== */

        const currentDisplay =
            document.getElementById("current");

        const previousDisplay =
            document.getElementById("previous");

        const historyList =
            document.getElementById("historyList");

        const historyCount =
            document.getElementById("historyCount");



        /* =====================================
           UPDATE DISPLAY
        ===================================== */

        function updateDisplay() {

            currentDisplay.textContent =
                currentNumber;


            if (operator !== null) {

                previousDisplay.textContent =
                    previousNumber + " " + operator;

            }

            else {

                previousDisplay.textContent = "";

            }

        }



        /* =====================================
           ADD NUMBER
        ===================================== */

        function appendNumber(number) {

            /*
             If an error is displayed,
             start a new calculation.
            */

            if (currentNumber === "Error") {

                currentNumber = "0";

            }


            /*
             If the previous operation
             was completed, start fresh.
            */

            if (shouldResetScreen) {

                currentNumber = "";

                shouldResetScreen = false;

            }


            /*
             Prevent unnecessary leading zero.
            */

            if (currentNumber === "0") {

                currentNumber = number;

            }

            else {

                /*
                 Limit extremely long numbers.
                */

                if (currentNumber.length < 15) {

                    currentNumber += number;

                }

            }


            updateDisplay();

        }



        /* =====================================
           DECIMAL
        ===================================== */

        function appendDecimal() {

            if (currentNumber === "Error") {

                currentNumber = "0";

            }


            if (shouldResetScreen) {

                currentNumber = "0";

                shouldResetScreen = false;

            }


            /*
             Only allow one decimal point.
            */

            if (!currentNumber.includes(".")) {

                currentNumber += ".";

            }


            updateDisplay();

        }



        /* =====================================
           CHOOSE OPERATOR
        ===================================== */

        function chooseOperator(selectedOperator) {

            if (currentNumber === "Error") {

                return;

            }


            /*
             If user enters another operator
             before entering the second number,
             simply replace the operator.
            */

            if (
                operator !== null &&
                shouldResetScreen
            ) {

                operator = selectedOperator;

                updateDisplay();

                return;

            }


            /*
             If there is already an operation,
             calculate it first.
            */

            if (
                operator !== null &&
                !shouldResetScreen
            ) {

                calculate();

            }


            previousNumber = currentNumber;

            operator = selectedOperator;

            shouldResetScreen = true;


            updateDisplay();

        }



        /* =====================================
           CALCULATE
        ===================================== */

        function calculate() {

            /*
             No operation to calculate.
            */

            if (
                operator === null ||
                shouldResetScreen
            ) {

                return;

            }


            const firstNumber =
                parseFloat(previousNumber);


            const secondNumber =
                parseFloat(currentNumber);


            /*
             Check for invalid numbers.
            */

            if (
                isNaN(firstNumber) ||
                isNaN(secondNumber)
            ) {

                return;

            }


            let result;


            /* ==============================
               MATHEMATICAL OPERATION
            ============================== */

            switch (operator) {


                case "+":

                    result =
                        firstNumber + secondNumber;

                    break;


                case "-":

                    result =
                        firstNumber - secondNumber;

                    break;


                case "×":

                    result =
                        firstNumber * secondNumber;

                    break;


                case "÷":

                    /*
                     Prevent division by zero.
                    */

                    if (secondNumber === 0) {

                        currentNumber = "Error";

                        previousNumber = "";

                        operator = null;

                        shouldResetScreen = true;

                        previousDisplay.textContent =
                            "Cannot divide by zero";

                        updateDisplay();

                        return;

                    }


                    result =
                        firstNumber / secondNumber;

                    break;

            }


            /*
             Prevent Infinity or NaN.
            */

            if (!Number.isFinite(result)) {

                currentNumber = "Error";

                previousNumber = "";

                operator = null;

                shouldResetScreen = true;

                updateDisplay();

                return;

            }


            /*
             Save calculation.
            */

            const calculation =
                formatNumber(firstNumber) +
                " " +
                operator +
                " " +
                formatNumber(secondNumber) +
                " = " +
                formatNumber(result);


            addToHistory(calculation);


            /*
             Show result.
            */

            currentNumber =
                formatNumber(result);


            previousNumber = "";

            operator = null;

            shouldResetScreen = true;


            /*
             Remember last operation.
             This allows useful repeated
             calculations without breaking
             normal calculator behavior.
            */

            lastOperation = {
                operator: operator,
                number: secondNumber
            };


            updateDisplay();

        }



        /* =====================================
           FORMAT NUMBER
        ===================================== */

        function formatNumber(number) {

            if (!Number.isFinite(number)) {

                return "Error";

            }


            /*
             Avoid JavaScript floating-point
             results such as:
             0.1 + 0.2 = 0.30000000000000004
            */

            return parseFloat(
                number.toFixed(10)
            ).toString();

        }



        /* =====================================
           CLEAR
        ===================================== */

        function clearCalculator() {

            currentNumber = "0";

            previousNumber = "";

            operator = null;

            shouldResetScreen = false;

            lastOperation = null;


            updateDisplay();

        }



        /* =====================================
           DELETE
        ===================================== */

        function deleteNumber() {

            /*
             If result/error is showing,
             don't delete it.
            */

            if (shouldResetScreen) {

                return;

            }


            /*
             If only one character remains,
             return to zero.
            */

            if (currentNumber.length <= 1) {

                currentNumber = "0";

            }

            else {

                currentNumber =
                    currentNumber.slice(0, -1);

            }


            /*
             Prevent "-0" or empty display.
            */

            if (
                currentNumber === "" ||
                currentNumber === "-"
            ) {

                currentNumber = "0";

            }


            updateDisplay();

        }



        /* =====================================
           PERCENTAGE
        ===================================== */

        function percentage() {

            if (currentNumber === "Error") {

                return;

            }


            let number =
                parseFloat(currentNumber);


            if (isNaN(number)) {

                return;

            }


            number = number / 100;


            currentNumber =
                formatNumber(number);


            shouldResetScreen = false;


            updateDisplay();

        }



        /* =====================================
           HISTORY
        ===================================== */

        function addToHistory(calculation) {

            /*
             Remove "No calculations yet".
            */

            const empty =
                historyList.querySelector(
                    ".empty-history"
                );


            if (empty) {

                empty.remove();

            }


            const item =
                document.createElement("div");


            item.className =
                "history-item";


            item.textContent =
                calculation;


            historyList.prepend(item);


            /*
             Keep only 5 calculations.
            */

            while (
                historyList.children.length > 5
            ) {

                historyList.removeChild(
                    historyList.lastChild
                );

            }


            updateHistoryCount();

        }



        /* =====================================
           HISTORY COUNT
        ===================================== */

        function updateHistoryCount() {

            const count =
                historyList.querySelectorAll(
                    ".history-item"
                ).length;


            historyCount.textContent =
                count +
                (count === 1
                    ? " calculation"
                    : " calculations");

        }



        /* =====================================
           KEYBOARD SUPPORT
        ===================================== */

        document.addEventListener(
            "keydown",
            function(event) {

                const key = event.key;


                /*
                 Prevent browser actions
                 for calculator keys.
                */

                if (
                    [
                        "Enter",
                        "Backspace",
                        "Escape",
                        "/",
                        "*",
                        "%",
                        "+",
                        "-",
                        "="
                    ].includes(key)
                ) {

                    event.preventDefault();

                }


                /* ==========================
                   NUMBERS
                ========================== */

                if (
                    key >= "0" &&
                    key <= "9"
                ) {

                    appendNumber(key);

                    highlightKey(key);

                    return;

                }


                /* ==========================
                   DECIMAL
                ========================== */

                if (key === ".") {

                    appendDecimal();

                    highlightKey(".");

                    return;

                }


                /* ==========================
                   ADDITION
                ========================== */

                if (key === "+") {

                    chooseOperator("+");

                    highlightKey("+");

                    return;

                }


                /* ==========================
                   SUBTRACTION
                ========================== */

                if (key === "-") {

                    chooseOperator("-");

                    highlightKey("-");

                    return;

                }


                /* ==========================
                   MULTIPLICATION
                ========================== */

                if (key === "*") {

                    chooseOperator("×");

                    highlightKey("*");

                    return;

                }


                /* ==========================
                   DIVISION
                ========================== */

                if (key === "/") {

                    chooseOperator("÷");

                    highlightKey("/");

                    return;

                }


                /* ==========================
                   ENTER / EQUALS
                ========================== */

                if (
                    key === "Enter" ||
                    key === "="
                ) {

                    calculate();

                    highlightKey("Enter");

                    return;

                }


                /* ==========================
                   BACKSPACE
                ========================== */

                if (key === "Backspace") {

                    deleteNumber();

                    highlightKey("Backspace");

                    return;

                }


                /* ==========================
                   ESCAPE / CLEAR
                ========================== */

                if (key === "Escape") {

                    clearCalculator();

                    highlightKey("Escape");

                    return;

                }


                /* ==========================
                   PERCENTAGE
                ========================== */

                if (key === "%") {

                    percentage();

                    highlightKey("%");

                    return;

                }

            }
        );



        /* =====================================
           KEYBOARD BUTTON ANIMATION
        ===================================== */

        function highlightKey(key) {

            const button =
                document.querySelector(
                    `[data-key="${key}"]`
                );


            if (!button) {

                return;

            }


            button.classList.add("active");


            setTimeout(
                function() {

                    button.classList.remove(
                        "active"
                    );

                },
                100
            );

        }



        /* =====================================
           INITIALIZE
        ===================================== */

        updateDisplay();

        updateHistoryCount();

    </script>

</body>
</html>
